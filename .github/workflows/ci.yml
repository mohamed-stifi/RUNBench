name: ci
# Issue #15 gates. PRs touching benchmark material trigger all gates;
# pushes to main re-prove them on the sample scenario.
on:
  pull_request:
    paths: [scenarios/**, schemas/**, leaderboard/**, runner/**, harness/**, evaluator/**, env/**, agents/**, ci/**]
  push:
    branches: [main]
    paths: [scenarios/**, schemas/**, leaderboard/**, runner/**, harness/**, evaluator/**, env/**, agents/**, ci/**]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: for f in scenarios/*.yaml; do python schemas/validate.py "$f"; done

  oracle-5x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: changed range
        id: r
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "range=origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          for d in run.dag-failure.001 $(git diff --name-only '${{ steps.r.outputs.range }}' -- scenarios/ | grep -oE 'scenarios/[^/]+' | sed 's|scenarios/||' | sort -u); do
            [ -f "scenarios/$d/solution.sh" ] && sh ci/oracle-5x.sh "$d"
          done

  redaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh runner/test-safety.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz -C /tmp
          /tmp/gitleaks detect --source . --no-git -v || { echo "GATE-FAIL: gitleaks found leaks"; exit 1; }
          echo "SECRETS-OK"

  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema
      - run: |
          sh ci/check-canary.sh
          sh ci/check-seed-pinning.sh
          sh ci/check-hidden-split.sh
          sh ci/check-trials.sh leaderboard/board.sample.json

  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            sh ci/check-append-only.sh "origin/${{ github.base_ref }}" HEAD .
          else
            sh ci/check-append-only.sh HEAD~1 HEAD .
          fi
