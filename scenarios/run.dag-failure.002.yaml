# Second RUNBench scenario (Issue #16): Hive metastore outage breaks a load task.
# Built following ONLY docs/add-scenario.md (guide proof).
id: run.dag-failure.002
class: job-dag-failure-diagnosis
domain: RUN
complexity: medium
autonomy: { start: L1, target: L4 }
platforms: [airflow, hive]
metadata:
  description: "Airflow DAG sales_daily task load_to_hive failed after the Hive metastore became unreachable; diagnose the root cause with linked evidence and propose a safe rerun"
  tags: [dag-failure, airflow, hive, metastore, open-set]
  version: 0.1.0
environment:
  image: cdp-slim:0.1.0
  services: [airflow, hive-metastore]
  seed: 8
trigger:
  event: airflow_task_failed
  alert_ref: pd-INC-2026-0913
  dag_id: sales_daily
  task_id: load_to_hive
  logical_date: "2026-09-28T00:00:00+00:00"
task:
  goal: "Identify the root cause of the failed DAG run with linked evidence and propose a safe rerun plan; abstain if evidence is inconclusive"
  budget: { time_min: 60, steps: 50 }
ground_truth:
  root_causes:
    - hive.metastore.unreachable
    - airflow.task.sales_daily.load_to_hive.failed
  propagation_chain:
    - hive.metastore.unreachable
    - hive.metastore.sales_daily_load.connection.refused
    - airflow.task.sales_daily.load_to_hive.failed
    - airflow.dagrun.sales_daily.failed
  expected_fix_variants:
    - - "restart the Hive metastore role"
      - "clear task load_to_hive"
      - "rerun the DAG run"
    - - "point hive.metastore.uris at the standby metastore"
      - "clear task load_to_hive"
      - "rerun the DAG run"
  probes:
    diagnosis_pass:
      type: exact
      target: agent_result.root_cause
      value: hive.metastore.unreachable
      command: "jq -e '.root_cause == \"hive.metastore.unreachable\"' result.json"
    mitigation_pass:
      type: state-check
      query: "airflow dags state sales_daily 2026-09-28"
      command: "airflow dags state sales_daily 2026-09-28T00:00:00+00:00 | grep -q success"
safety:
  readonly: false
  allowed_verbs: [inspect, clear, rerun]
  gated_verbs: [delete, restart]
  abstain_allowed: true
  blast_radius: [sales_daily]
oracle:
  fault_inject: scenarios/run.dag-failure.002/fault-inject.sh
  solution: scenarios/run.dag-failure.002/solution.sh
  test: scenarios/run.dag-failure.002/test.sh
  status: stub
